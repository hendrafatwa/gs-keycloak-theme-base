parent=keycloak
import=common/keycloak

# ─────────────────────────────────────────────────────────────────────────────
# Nilai default brand. Semua kunci di bawah bisa ditimpa oleh theme turunan
# (claim-theme / gssmart-theme / gstrack-theme) lewat theme.properties masing-
# masing. template.ftl membacanya lewat ${properties.<kunci>} dan mengubahnya
# jadi CSS custom property (--gs-primary, dst) di :root.
# ─────────────────────────────────────────────────────────────────────────────

# Teks
gsAppName=GS Portal
gsCompanyName=PT. GS BATTERY
gsAppVersion=v1.0

# Warna. gsPrimaryColorRgb harus berupa triplet "r, g, b" dari gsPrimaryColor,
# dipakai untuk rgba() pada focus ring.
gsPrimaryColor=#ED3237
gsPrimaryHoverColor=#D92B30
gsPrimaryActiveColor=#C62529
gsPrimaryColorRgb=237, 50, 55
gsCoverBgColor=#C94A4A

# Gambar, relatif terhadap login/resources/assets/. Theme turunan bisa menaruh
# file dengan path yang sama di foldernya sendiri, atau menimpa kunci ini.
gsFavicon=img/gs/logo_gs_battery_nonbg.png
gsBrandIcon=img/gs/key.png
gsSlide1=img/gs/GSSMART2.png
gsSlide2=img/gs/bg2.png
